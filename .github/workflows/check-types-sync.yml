# Verifies frontend generated types stay in sync with backend OpenAPI spec.
# Runs on all PRs to catch schema drift early.

name: Check Types Sync

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/schemas.py"
      - "backend/app/main.py"
      - "frontend/types/generated.ts"
      - "frontend/package.json"

jobs:
  check-types-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-test-secret-key
        run: |
          # Start server in background
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 1
          done

      - name: Generate types from OpenAPI spec
        working-directory: frontend
        run: npm run types:generate

      - name: Check for uncommitted changes
        run: |
          if git diff --exit-code frontend/types/generated.ts; then
            echo "✅ Types are in sync with backend schema"
          else
            echo "❌ Types are out of sync!"
            echo ""
            echo "The generated types don't match the committed file."
            echo "Please run 'npm run types:generate' in the frontend directory"
            echo "and commit the updated types/generated.ts file."
            echo ""
            echo "Diff:"
            git diff frontend/types/generated.ts
            exit 1
          fi
