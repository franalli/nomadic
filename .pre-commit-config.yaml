repos:
  # ----- Core hygiene -----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key # Secret check (SSH/PEM keys)

  # ----- Security -----
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^backend/(migrations|test_artifacts)/

  # ----- Python formatting / linting -----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ----- P2: SSoT Violations Check -----
  - repo: local
    hooks:
      - id: ssot-check
        name: Check SSoT violations in plan_graph.py
        entry: python backend/scripts/check_ssot_violations.py
        language: python
        files: ^backend/app/plan_graph\.py$
        pass_filenames: false
        always_run: false
