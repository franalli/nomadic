version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nomadic_user
      POSTGRES_PASSWORD: NomadicHunters2024!
      POSTGRES_DB: nomadic
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    profiles: ["backend"] # Enable with: docker compose --profile backend up --build
    build: ./backend
    env_file:
      - backend/.env.docker
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  db-data:
