[tool.black]
line-length =100
target-version = ["py312"]
include = "app/"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
# Errors, flake8, imports, bugbear
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "nightly: mark test as nightly (slow, comprehensive)",
    "slow: mark test as slow running",
    "golden: mark test as golden replay test",
    "e2e: End-to-end integration test (hermetic with FakeLLM unless llm_smoke)",
    "llm_smoke: LLM-judged smoke test (requires OPENAI_API_KEY, manual only)",
]
